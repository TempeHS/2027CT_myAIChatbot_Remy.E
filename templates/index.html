<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My AI Chatbot</title>
    <!-- Bootstrap CSS from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #404040;
        --bg-dark: #121212;
        --border-colour: #4b4b4b;
        --text-light: #333;
        --bot-bg: #ffffff;
      }

      html[data-theme="light"] {
        --bg-primary: #f5f5f5;
        --bg-dark: #ffffff;
        --border-colour: #ddd;
        --text-light: #1a1a1a;
        --bot-bg: #dadada;
      }

      body {
        background-color: var(--bg-primary);
        transition: background-color 0.3s ease;
      }

      .theme-toggle {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
      }

      .chat-container {
        max-width: 600px;
        margin: 50px auto;
      }

      .chat-box {
        height: 400px;
        overflow-y: auto;
        border: 1px solid var(--border-colour);
        border-radius: 10px;
        padding: 20px;
        background-color: var(--bg-dark);
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition:
          background-color 0.3s ease,
          border-colour 0.3s ease;
      }

      .message {
        display: inline-block;
        padding: 10px 15px;
        border-radius: 15px;
        max-width: 80%;
        word-wrap: break-word;
        white-space: pre-wrap;
      }

      .user-message {
        background-color: #007bff;
        color: white;
        align-self: flex-end;
      }

      .bot-message {
        background-color: var(--bot-bg);
        color: var(--text-light);
        align-self: flex-start;
      }

      .card {
        background-color: var(--bg-dark);
        border-color: var(--border-color);
        transition: background-color 0.3s ease;
      }

      .card-body {
        color: var(--text-light);
      }
    </style>
  </head>
  <body>
    <!-- Dark mode toggle button -->
    <div class="theme-toggle">
      <button
        id="theme-toggle-btn"
        class="btn btn-outline-secondary"
        title="Toggle dark/light mode"
        aria-label="Toggle theme"
      >
        🌙
      </button>
    </div>

    <div class="chat-container">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Chat FreePT</h4>
        </div>
        <div class="alert alert-warning mt-3" role="alert">
          <strong>⚠️ Disclaimer:</strong> I'm an AI chatbot created by a
          student. I don't always give accurate information and I'm not a
          substitute for talking to a real person. If you need help, please
          speak with a trusted adult or contact a helpline.
        </div>
        <div class="card-body">
          <div id="chat-box" class="chat-box">
            <div class="message bot-message">
              Hello, how can I help you today?
            </div>
          </div>
          <form id="chat-form" class="mt-3">
            <div class="d-flex gap-3">
              <div class="flex-grow-1">
                <div class="input-group">
                  <input
                    type="text"
                    id="message-input"
                    class="form-control"
                    placeholder="Type your message..."
                    autocomplete="off"
                    maxlength="500"
                  />
                  <button type="submit" class="btn btn-primary">Send</button>
                </div>
              </div>
              <div class="d-flex align-items-center gap-2">
                <button
                  type="button"
                  id="download-btn"
                  class="btn btn-success"
                  title="Download chat as text file"
                >
                  ⬇️ Download
                </button>
                <button type="button" id="clear-btn" class="btn btn-secondary">
                  Clear
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Our chat JavaScript -->
    <script>
      const chatForm = document.getElementById("chat-form");
      const messageInput = document.getElementById("message-input");
      const chatBox = document.getElementById("chat-box");
      const clearBtn = document.getElementById("clear-btn");
      const themeToggleBtn = document.getElementById("theme-toggle-btn");
      // same greeting as in the initial markup
      const initialGreeting = "Hello, how can I help you today?";

      // prepare Bootstrap toast instance (toast element is added below)
      const clearToastEl = document.getElementById("clear-toast");
      const clearToast = clearToastEl
        ? new bootstrap.Toast(clearToastEl)
        : null;

      // Theme toggle functionality
      function initialiseTheme() {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
        updateThemeButton(savedTheme);
      }

      function updateThemeButton(theme) {
        themeToggleBtn.textContent = theme === "dark" ? "☀️" : "🌙";
      }

      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme") || "dark";
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateThemeButton(newTheme);
      }

      themeToggleBtn.addEventListener("click", toggleTheme);

      // Initialise theme on page load
      initialiseTheme();

      // Function to add a message to the chat
      function addMessage(text, isUser) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${isUser ? "user-message" : "bot-message"}`;
        messageDiv.textContent = text;
        chatBox.appendChild(messageDiv);
        // Scroll to the bottom
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // Clear chat (keeps non-message elements like the disclaimer)
      clearBtn.addEventListener("click", function () {
        const messages = chatBox.querySelectorAll(".message");
        messages.forEach((m) => m.remove());
        // Re-greet with the same initial bot message
        addMessage(initialGreeting, false);
        // Show small popup (not a bot message)
        if (clearToast) clearToast.show();
        messageInput.focus();
      });

      // Download chat functionality
      document
        .getElementById("download-btn")
        .addEventListener("click", async function () {
          const messageElements = chatBox.querySelectorAll(".message");
          const messages = [];

          messageElements.forEach((el) => {
            const isUser = el.classList.contains("user-message");
            messages.push({
              sender: isUser ? "User" : "Bot",
              message: el.textContent,
            });
          });

          if (messages.length === 0) {
            alert("No messages to download.");
            return;
          }

          try {
            const response = await fetch("/download_chat", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ messages: messages }),
            });

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "chat.txt";
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
          } catch (error) {
            alert("Error downloading chat. Please try again.");
            console.error("Error:", error);
          }
        });

      // Handle form submission
      chatForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const message = messageInput.value.trim();
        if (!message) return;

        // Add user message to chat
        addMessage(message, true);
        messageInput.value = "";

        try {
          // Send message to Flask backend
          const response = await fetch("/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message: message }),
          });

          const data = await response.json();

          // Add bot response to chat
          addMessage(data.response, false);
        } catch (error) {
          addMessage("Sorry, something went wrong. Please try again.", false);
          console.error("Error:", error);
        }
      });
    </script>

    <!-- Toast: small popup for "Chat cleared." -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
      <div
        id="clear-toast"
        class="toast align-items-center text-bg-primary border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body">Chat cleared.</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>
  </body>
</html>
